<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Slayer - Demo Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .game-container {
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { color: #aaa; margin-bottom: 30px; }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
        }
        .stat-label { font-size: 0.9em; color: #aaa; }
        .stat-value { font-size: 2em; font-weight: bold; color: #ffd700; }
        .dragon {
            font-size: 120px;
            margin: 20px 0;
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }
        .dragon:hover { transform: scale(1.1); }
        .dragon:active { transform: scale(0.95); }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .achievements {
            margin-top: 30px;
            text-align: left;
        }
        .achievement {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .achievement.unlocked { background: rgba(76, 175, 80, 0.3); }
        .badge { background: #ffd700; color: #000; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
        .input-group {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        input {
            padding: 10px;
            border-radius: 5px;
            border: none;
            width: 200px;
            font-size: 1em;
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: none;
            animation: slideIn 0.3s;
        }
        @keyframes slideIn {
            from { transform: translateX(400px); }
            to { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐉 Dragon Slayer</h1>
        <p class="subtitle">Click the dragon to attack! Earn NFT rewards!</p>

        <div class="input-group">
            <input type="text" id="accountId" placeholder="Your Hedera Account ID" value="0.0.">
            <button onclick="saveAccount()">Save Account</button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Dragons Defeated</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Current HP</div>
                <div class="stat-value" id="hp">100</div>
            </div>
        </div>

        <div class="dragon" onclick="attackDragon()">🐉</div>

        <button onclick="resetGame()">Reset Game</button>

        <div class="achievements">
            <h3>🏆 Achievements & NFT Rewards</h3>
            <div class="achievement" id="achievement1">
                <span>First Blood - Defeat 1 dragon</span>
                <span class="badge">Bronze Sword NFT</span>
            </div>
            <div class="achievement" id="achievement10">
                <span>Dragon Hunter - Defeat 10 dragons</span>
                <span class="badge">Silver Sword NFT</span>
            </div>
            <div class="achievement" id="achievement50">
                <span>Dragon Master - Defeat 50 dragons</span>
                <span class="badge">Golden Sword NFT</span>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script src="../sdk/gamersnft-sdk.js"></script>
    <script>
        const API_KEY = 'gn_z5k7b8rrkpq1py2mpvsezf';
        let score = 0;
        let dragonHP = 100;
        let playerAccount = localStorage.getItem('playerAccount') || '';
        let sdk = null;

        async function initSDK() {
            try {
                sdk = new GamersNFT(API_KEY, 'http://localhost:3001');
                await sdk.initialize();
                console.log('SDK initialized successfully');
            } catch (error) {
                console.error('SDK init failed:', error);
                showNotification('⚠️ SDK not initialized: ' + error.message, 'warning');
            }
        }

        if (playerAccount) {
            document.getElementById('accountId').value = playerAccount;
        }

        // Initialize SDK on page load
        window.addEventListener('DOMContentLoaded', initSDK);

        function saveAccount() {
            const accountId = document.getElementById('accountId').value;
            if (accountId && accountId !== '0.0.') {
                playerAccount = accountId;
                localStorage.setItem('playerAccount', accountId);
                showNotification('✅ Account saved!');
            } else {
                showNotification('⚠️ Please enter a valid account ID', 'warning');
            }
        }

        function attackDragon() {
            dragonHP -= 10;
            document.getElementById('hp').textContent = dragonHP;

            if (dragonHP <= 0) {
                score++;
                document.getElementById('score').textContent = score;
                dragonHP = 100;
                document.getElementById('hp').textContent = dragonHP;
                
                showNotification('🎉 Dragon defeated!');
                checkAchievements();
            }
        }

        async function checkAchievements() {
            if (!playerAccount || playerAccount === '0.0.') {
                showNotification('⚠️ Please set your Hedera account ID first!', 'warning');
                return;
            }

            if (score === 1) {
                await unlockAchievement('achievement1', 'bronze_sword', 'Bronze Sword');
            } else if (score === 10) {
                await unlockAchievement('achievement10', 'silver_sword', 'Silver Sword');
            } else if (score === 50) {
                await unlockAchievement('achievement50', 'golden_sword', 'Golden Sword');
            }
        }

        async function unlockAchievement(elementId, templateId, nftName) {
            const element = document.getElementById(elementId);
            if (element.classList.contains('unlocked')) return;

            element.classList.add('unlocked');
            showNotification(`🏆 Achievement Unlocked! Minting ${nftName} NFT...`);

            if (sdk) {
                try {
                    const result = await sdk.mintReward(playerAccount, templateId, {
                        achievement: elementId,
                        dragonsDefeated: score,
                        timestamp: new Date().toISOString()
                    });
                    showNotification(`✨ ${nftName} NFT minted! Check your collectibles.`);
                    console.log('NFT minted:', result);
                } catch (error) {
                    console.error('Mint failed:', error);
                    showNotification(`⚠️ Failed to mint NFT: ${error.message}`, 'warning');
                }
            } else {
                showNotification('⚠️ SDK not initialized. NFT not minted.', 'warning');
            }
        }

        function resetGame() {
            if (confirm('Reset game progress? (NFTs will remain in your wallet)')) {
                score = 0;
                dragonHP = 100;
                document.getElementById('score').textContent = score;
                document.getElementById('hp').textContent = dragonHP;
                document.querySelectorAll('.achievement').forEach(el => el.classList.remove('unlocked'));
                showNotification('🔄 Game reset!');
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            notification.style.background = type === 'warning' ? '#ff9800' : '#4caf50';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }


    </script>
</body>
</html>
