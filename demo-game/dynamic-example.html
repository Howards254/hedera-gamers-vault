<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Minting Demo - Arena Breakout Style</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      background: rgba(0,0,0,0.3);
      padding: 30px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }
    h1 { text-align: center; margin-bottom: 30px; }
    .game-area {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      margin: 10px 0;
    }
    button:hover { background: #45a049; }
    button:disabled { background: #cccccc; cursor: not-allowed; }
    .loot-display {
      background: rgba(255,255,255,0.2);
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
    }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
    .stat { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 5px; }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
      box-sizing: border-box;
    }
    .success { background: #4CAF50; padding: 15px; border-radius: 5px; margin: 10px 0; }
    .error { background: #f44336; padding: 15px; border-radius: 5px; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Arena Breakout - Raid Simulator</h1>
    
    <div class="game-area">
      <h2>Player Setup</h2>
      <input type="text" id="playerAccount" placeholder="Enter your Hedera Account ID (0.0.xxx)" />
      <button onclick="startRaid()">🎯 Start Raid</button>
    </div>

    <div id="lootArea" style="display:none;">
      <h2>🎁 Loot Dropped!</h2>
      <div class="loot-display" id="lootDisplay"></div>
      <button onclick="mintLoot()">✨ Mint as NFT</button>
    </div>

    <div id="result"></div>
  </div>

  <script src="../sdk/gamersnft-sdk.js"></script>
  <script>
    const API_KEY = 'gn_z5k7b8rrkpq1py2mpvsezf'; // Demo game API key
    let gamersNFT;
    let currentLoot = null;

    // Initialize SDK
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        gamersNFT = new GamersNFT(API_KEY, 'http://localhost:3001');
        await gamersNFT.initialize();
        console.log('SDK initialized');
      } catch (error) {
        showResult('Failed to initialize SDK: ' + error.message, 'error');
      }
    });

    // Weapon types and rarities
    const weapons = ['AK-47', 'M4A1', 'AWP', 'Desert Eagle', 'MP5'];
    const rarities = ['Common', 'Rare', 'Epic', 'Legendary', 'Mythic'];
    const attachments = ['Red Dot Sight', 'Holographic Sight', 'Extended Mag', 'Suppressor', 'Laser Sight', 'Grip'];
    const locations = ['Armory', 'Bunker', 'Factory', 'Warehouse', 'Command Center'];

    function generateRandomLoot() {
      const weapon = weapons[Math.floor(Math.random() * weapons.length)];
      const rarity = rarities[Math.floor(Math.random() * rarities.length)];
      const level = Math.floor(Math.random() * 20) + 1;
      const location = locations[Math.floor(Math.random() * locations.length)];
      
      // Random attachments (1-3)
      const numAttachments = Math.floor(Math.random() * 3) + 1;
      const selectedAttachments = [];
      for (let i = 0; i < numAttachments; i++) {
        const att = attachments[Math.floor(Math.random() * attachments.length)];
        if (!selectedAttachments.includes(att)) {
          selectedAttachments.push(att);
        }
      }

      // Stats based on rarity
      const rarityMultiplier = rarities.indexOf(rarity) + 1;
      
      return {
        name: `${weapon} +${level}`,
        weapon: weapon,
        level: level,
        rarity: rarity,
        location: location,
        damage: 30 + (rarityMultiplier * 10) + Math.floor(Math.random() * 20),
        fireRate: 400 + Math.floor(Math.random() * 400),
        accuracy: 60 + (rarityMultiplier * 5) + Math.floor(Math.random() * 15),
        condition: 95 + Math.floor(Math.random() * 5),
        attachments: selectedAttachments,
        imageUrl: `https://via.placeholder.com/512/667eea/ffffff?text=${weapon.replace(' ', '+')}`,
        timestamp: new Date().toISOString()
      };
    }

    function startRaid() {
      const playerAccount = document.getElementById('playerAccount').value.trim();
      
      if (!playerAccount || !playerAccount.match(/^0\.0\.\d+$/)) {
        showResult('Please enter a valid Hedera Account ID (format: 0.0.xxx)', 'error');
        return;
      }

      // Generate random loot
      currentLoot = generateRandomLoot();
      
      // Display loot
      const lootHtml = `
        <h3>${currentLoot.name}</h3>
        <p><strong>Rarity:</strong> ${currentLoot.rarity}</p>
        <p><strong>Found in:</strong> ${currentLoot.location}</p>
        <div class="stats">
          <div class="stat">💥 Damage: ${currentLoot.damage}</div>
          <div class="stat">🔫 Fire Rate: ${currentLoot.fireRate}</div>
          <div class="stat">🎯 Accuracy: ${currentLoot.accuracy}%</div>
          <div class="stat">🔧 Condition: ${currentLoot.condition}%</div>
        </div>
        <p><strong>Attachments:</strong> ${currentLoot.attachments.join(', ')}</p>
      `;
      
      document.getElementById('lootDisplay').innerHTML = lootHtml;
      document.getElementById('lootArea').style.display = 'block';
      document.getElementById('result').innerHTML = '';
    }

    async function mintLoot() {
      const playerAccount = document.getElementById('playerAccount').value.trim();
      
      if (!currentLoot) {
        showResult('No loot to mint!', 'error');
        return;
      }

      showResult('Minting NFT... Please wait...', 'success');

      try {
        const result = await gamersNFT.mintDynamic(playerAccount, {
          name: currentLoot.name,
          description: `${currentLoot.rarity} ${currentLoot.weapon} found in ${currentLoot.location} raid. Equipped with ${currentLoot.attachments.join(', ')}.`,
          imageUrl: currentLoot.imageUrl,
          type: 'Weapon',
          rarity: currentLoot.rarity,
          attributes: {
            weapon: currentLoot.weapon,
            level: currentLoot.level,
            damage: currentLoot.damage,
            fireRate: currentLoot.fireRate,
            accuracy: currentLoot.accuracy,
            condition: currentLoot.condition,
            attachments: currentLoot.attachments,
            foundIn: currentLoot.location,
            foundAt: currentLoot.timestamp
          }
        });

        showResult(`
          <h3>✅ NFT Minted Successfully!</h3>
          <p><strong>NFT ID:</strong> ${result.nftId}</p>
          <p><strong>Serial Number:</strong> ${result.serialNumber}</p>
          <p>Check your collectibles in the marketplace!</p>
        `, 'success');

        // Reset
        currentLoot = null;
        document.getElementById('lootArea').style.display = 'none';
        
      } catch (error) {
        showResult('Failed to mint NFT: ' + error.message, 'error');
      }
    }

    function showResult(message, type) {
      document.getElementById('result').innerHTML = `<div class="${type}">${message}</div>`;
    }
  </script>
</body>
</html>
