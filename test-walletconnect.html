<!DOCTYPE html>
<html>
<head>
    <title>WalletConnect Test</title>
</head>
<body>
    <h1>WalletConnect Project ID Test</h1>
    <button onclick="testConnection()">Test Connection</button>
    <div id="result"></div>

    <script>
        async function testConnection() {
            const projectId = 'dfe22a1aca8d834168d51a5ac05cec7b';
            const testUrl = `https://verify.walletconnect.org/v3/attestation?projectId=${projectId}&origin=${encodeURIComponent(window.location.origin)}`;
            
            try {
                const response = await fetch(testUrl);
                document.getElementById('result').innerHTML = `
                    <p>Status: ${response.status}</p>
                    <p>${response.status === 200 ? '✅ Approved!' : '❌ Not approved yet'}</p>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
