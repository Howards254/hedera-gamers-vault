[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  SECRETS_SCAN_OMIT_KEYS = "VITE_HEDERA_NETWORK,VITE_PINATA_GATEWAY,VITE_PROJECT_ID"
  SECRETS_SCAN_OMIT_PATHS = "test-walletconnect.html,server/**"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
